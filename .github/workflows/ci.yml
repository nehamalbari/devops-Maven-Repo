name: DevOpsJavaCIAutomationPipeline
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [17, 21]

    steps:
    - name: CheckoutSourceCode
      uses: actions/checkout@v4
    - name: SetupJDK${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: 'maven'
    - name: RunAutomatedTestSuites
      run: mvn test

  deploy-staging:
    needs: build-and-validate
    runs-on: ubuntu-latest
    environment: staging
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
    - name: Deploy to Staging Container
      run: |
        compose_file=""
        for file in docker-compose.yml docker-compose.yaml compose.yml compose.yaml; do
          if [ -f "$file" ]; then
            compose_file="$file"
            break
          fi
        done

        if [ -n "$compose_file" ]; then
          echo "Approval granted! Deploying to staging stack using $compose_file..."
          docker compose -f "$compose_file" up -d
        else
          echo "No Docker Compose file found. Skipping staging deployment."
        fi

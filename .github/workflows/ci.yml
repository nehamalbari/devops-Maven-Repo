name: DevOps Java CI Automation Pipeline

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Compile Code Base
        run: mvn clean compile

      - name: Run Automated Test Suites
        run: mvn test

      - name: Package Executable Distribution
        run: mvn package

      - name: Upload Build Artifact for Verification
        uses: actions/upload-artifact@v4
        with:
          name: production-ready-jar
          path: target/*.jar
          retention-days: 5
